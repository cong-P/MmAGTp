<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Território 4.10</title>
<style>
  /* O cartão impresso tem 14,5 x 9,5 cm, o tamanho dos que a congregação
     usa. Desenha-se aqui maior, a 210 x 137,59 mm (a mesma forma), e a
     impressão do Engine encolhe-o para 145 x 95 mm (x 0,6905): assim as
     letras e as margens continuam afinadas como estavam no A5, e é só a
     altura que mudou. Tudo em mm/pt para o tamanho no papel não depender do
     zoom do browser. */
  @page {
    size: 210mm 137.59mm;
    margin: 0;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 10mm;
    padding: 0;
    background-color: #f4f4f4;
    color: #000;
  }

  .card {
    display: flex;
    width: 210mm;
    height: 137.59mm;
    border: 1.2mm solid #000;
    box-sizing: border-box;
    background-color: #fff;
    overflow: hidden;
  }

  .sidebar {
    width: 34%;
    display: flex;
    flex-direction: column;
    border-right: 1.2mm solid #000;
    box-sizing: border-box;
    /* Âncora da caixa de sugestões do "+ Rua": a secção das localizações tem
       overflow escondido e recortava-a. */
    position: relative;
  }

  .section {
    border-bottom: 1mm solid #000;
    padding: 3mm 3.5mm;
    box-sizing: border-box;
  }

  /* Título grande: é o que se procura num maço de cartões */
  .header {
    background-color: #d9d9d9;
    text-align: center;
    font-weight: bold;
    font-size: 21pt;
    line-height: 1.1;
    padding: 4mm 2mm;
  }

  .locations {
    background-color: #ffe699;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* "Localizações" e "Referência" são títulos de secção: ficam maiores do que
     o conteúdo que encabeçam */
  .rotulo {
    display: block;
    font-size: 15pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.3pt;
    margin-bottom: 2.5mm;
  }

  .ruas {
    list-style: none;
    padding-left: 0;
    margin: 0;
    font-size: 13pt;
    font-weight: bold;
    line-height: 1.25;
    flex: 0 1 auto;
    min-height: 0;
  }

  /* Espaço entre ruas proporcional à letra: com 15 ruas, 2,2 mm fixos
     gastavam 33 mm só em espaços em branco */
  .ruas li {
    display: flex;
    align-items: flex-start;
    margin-bottom: 0.45em;
    break-inside: avoid;
  }

  .ruas .traco {
    flex: 0 0 auto;
    width: 4mm;
    margin-right: 1mm;
  }

  /* O mesmo número aparece no mapa, dentro de um círculo amarelo */
  .ruas .num {
    flex: 0 0 auto;
    width: 6.2mm;
    height: 6.2mm;
    margin-right: 2mm;
    border: 0.4mm solid #000;
    border-radius: 50%;
    background-color: #fcca03;
    text-align: center;
    line-height: 6.2mm;
    font-size: 10.5pt;
  }

  .ruas .nome {
    flex: 1 1 auto;
  }

  .reference {
    background-color: #dbe5f1;
    flex: 0 0 auto;
  }

  /* Espaço livre para escrever, sem caixa desenhada */
  .reference .caixa {
    min-height: 9mm;
    padding: 0.5mm 0;
    font-size: 12pt;
    box-sizing: border-box;
  }

  .fogos {
    background-color: #dbe5f1;
    text-align: center;
    font-weight: bold;
    font-size: 16pt;
    border-bottom: none;
    padding: 3.5mm 2mm;
    flex: 0 0 auto;
  }

  .map-container {
    width: 66%;
    height: 100%;
    overflow: hidden;
    position: relative;
    background-color: #f0f0f0;
  }

  /* "fill" (e não "cover") para a imagem ocupar exatamente esta área: as
     etiquetas são posicionadas em percentagem e têm de assentar no sítio */
  .map-image {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
  }

  /* --- Etiquetas do mapa (ruas e números de porta) ----------------------
     São texto por cima da imagem e não fazem parte do PNG: dá para corrigir,
     acrescentar, arrastar e apagar sem voltar a gerar o cartão. */
  .chamadas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .etiqueta {
    position: absolute;
    transform: translate(-50%, -50%) rotate(var(--ang, 0deg));
    text-align: center;
    line-height: 1.15;
    cursor: move;
    white-space: nowrap;
    /* Num ecrã de toque, sem isto o dedo pousado numa etiqueta rolava a
       página e o arrasto era cancelado a meio — não havia forma de mudar
       uma etiqueta de sítio senão com rato. */
    touch-action: none;
  }

  .etiqueta .txt {
    display: inline-block;
    font-weight: bold;
    color: #000;
  }

  /* Contorno branco à volta das letras, como nos mapas: acompanha a estrada
     e deixa ver o que está por baixo. Os tamanhos são para quem vê mal, em
     papel; o gerador escreve-os em cada etiqueta (e usa-os para as afastar
     umas das outras), estes são só para as que se acrescentam à mão. */
  .etiqueta.rua .txt {
    font-size: 12pt;
    -webkit-text-stroke: 3.6px #fff;
    paint-order: stroke fill;
  }

  /* Ruas da vizinhança: servem para dar referências a quem procura o
     território, por isso são secundárias — um pouco mais pequenas e em
     cinzento escuro — mas continuam a negrito: fininhas não se liam */
  .etiqueta.vizinha .txt {
    font-size: 10.5pt;
    color: #3a3a3a;
    -webkit-text-stroke: 3.2px #fff;
    paint-order: stroke fill;
  }

  .etiqueta.porta .txt {
    font-size: 12pt;
    background-color: #fff;
    border: 0.35mm solid #000;
    border-radius: 0.6mm;
    padding: 0.2mm 0.9mm;
  }

  .etiqueta.numero .txt {
    width: 7mm;
    height: 7mm;
    line-height: 7mm;
    font-size: 12pt;
    background-color: #fcca03;
    border: 0.5mm solid #000;
    border-radius: 50%;
  }

  .etiqueta .txt:hover {
    outline: 0.3mm dashed #0066cc;
  }
  .etiqueta .txt:focus {
    outline: 0.4mm solid #0066cc;
    background-color: #fff;
  }

  .etiqueta .apagar,
  .etiqueta .rodar {
    position: absolute;
    width: 4.2mm;
    height: 4.2mm;
    padding: 0;
    display: none;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 8pt;
    line-height: 4.2mm;
    text-align: center;
  }
  .etiqueta .apagar {
    top: -2.2mm;
    right: -3mm;
    background-color: #c00;
    cursor: pointer;
  }
  /* Pega de rodar por cima da etiqueta: arrasta-se para a inclinar, como num
     editor de imagem. Antes a rotação só existia na roda do rato, que não se
     vê e não funciona bem em trackpad. */
  .etiqueta .rodar {
    top: -5.5mm;
    left: 50%;
    margin-left: -2.1mm;
    background-color: #0066cc;
    cursor: grab;
  }
  .etiqueta .rodar:active {
    cursor: grabbing;
  }
  .etiqueta:hover .apagar,
  .etiqueta:hover .rodar,
  .etiqueta.a-rodar .rodar {
    display: block;
  }
  /* Num ecrã de toque não há hover nenhum: é o toque que marca a etiqueta em
     que se está a mexer, e só essa mostra o × e a pega de rodar. */
  .etiqueta.tocada .apagar,
  .etiqueta.tocada .rodar {
    display: block;
  }
  /* Traço a ligar a pega à etiqueta, para se perceber que pertencem uma à
     outra */
  .etiqueta .rodar::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 0.3mm;
    height: 1.3mm;
    margin-left: -0.15mm;
    background-color: #0066cc;
  }

  .ferramentas {
    position: absolute;
    left: 2mm;
    bottom: 2mm;
    display: flex;
    gap: 1.5mm;
  }
  .ferramentas button,
  .btn-linha {
    font-family: inherit;
    font-size: 8.5pt;
    font-weight: bold;
    padding: 1mm 2mm;
    border: 0.3mm solid #333;
    border-radius: 1mm;
    background-color: rgba(255, 255, 255, 0.92);
    cursor: pointer;
  }

  .ruas .apagar-linha {
    flex: 0 0 auto;
    visibility: hidden;
    margin-left: 1mm;
    padding: 0 1mm;
    border: none;
    background: none;
    color: #c00;
    font-size: 11pt;
    font-weight: bold;
    cursor: pointer;
  }
  .ruas li:hover .apagar-linha {
    visibility: visible;
  }
  /* Sem rato o hover nunca acontece, e o × de remover uma rua ficava
     invisível para sempre. */
  @media (hover: none) {
    .ruas .apagar-linha { visibility: visible; }
  }

  /* As ruas à volta que o "+ Rua" propõe */
  .sugestoes {
    position: absolute;
    z-index: 5;
    max-height: 38mm;
    overflow-y: auto;
    padding: 0.8mm;
    border: 0.3mm solid #333;
    border-radius: 1mm;
    background-color: #fff;
    box-shadow: 0 1mm 3mm rgba(0, 0, 0, 0.25);
  }
  .sugestoes button {
    display: block;
    width: 100%;
    padding: 1mm 1.5mm;
    border: 0;
    border-radius: 0.8mm;
    background: none;
    font-family: inherit;
    font-size: 8.5pt;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }
  .sugestoes button:hover {
    background-color: #eef1f8;
  }
  .sugestoes .a-mao {
    border-top: 0.3mm solid #e2e8f0;
    margin-top: 0.8mm;
    padding-top: 1.2mm;
    font-weight: bold;
    color: #526CA2;
  }

  .btn-linha {
    align-self: flex-start;
    margin-top: 1mm;
  }

  .editable {
    border: 0.3mm solid transparent;
    border-radius: 1mm;
  }
  .editable:hover {
    background-color: rgba(255, 255, 255, 0.55);
    border-color: #666;
    border-style: dashed;
    cursor: text;
  }
  .editable:focus {
    background-color: #fff;
    border-color: #333;
    outline: none;
  }

  /* Verso */
  .verso {
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .verso .titulo-verso {
    font-size: 24pt;
    font-weight: bold;
    margin: 0 0 6mm;
  }
  .verso .aviso {
    font-size: 17pt;
    font-weight: bold;
    line-height: 1.3;
    margin: 0 0 6mm;
    text-transform: uppercase;
  }
  .verso img {
    width: 52mm;
    height: 52mm;
    border: 1mm solid #fcca03;
    border-radius: 3mm;
    padding: 2mm;
  }
  .verso .legenda {
    font-size: 13pt;
    font-weight: bold;
    margin-top: 4mm;
  }

  @media print {
    /* Sem isto o Chrome imprime os fundos (cinza, amarelo, azul) em branco */
    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body {
      margin: 0;
      background-color: #fff;
    }
    .card {
      margin: 0 !important;
      border-width: 0.8mm;
    }
    /* As ajudas de edição não vão para o papel, mas só elas: a regra não pode
       apagar os fundos desenhados (o azul dos "Fogos"). */
    .editable:hover,
    .editable:focus,
    .etiqueta .txt:hover,
    .etiqueta .txt:focus {
      background-color: inherit;
      border-color: transparent;
      outline: none;
    }
    .ferramentas,
    .btn-linha,
    .sugestoes,
    .apagar,
    .apagar-linha {
      display: none !important;
    }
  }
</style>
</head>
<!-- `data-cartao`: a versão do que este cartão sabe fazer sozinho. As
     páginas que o abrem para editar (ver public/territorios/estudio/
     cartaoExtras.js) dão aos cartões antigos, que não a têm, o arrasto a
     dedo e as sugestões do "+ Rua". -->
<body data-cartao="2">

      <div class="etiqueta rua" style="left: 52.145%; top: 30.17%; --ang: -25.8deg" data-ax="52.145" data-ay="30.17" data-nome="Rua Laura Alves"><span class="txt" style="font-size: 12pt" contenteditable="true" spellcheck="false">R. Laura Alves</span><button class="rodar" title="Arrastar para rodar">&#8635;</button><button class="apagar" title="Remover etiqueta">&times;</button></div>

      <div class="etiqueta vizinha" style="left: 11.251%; top: 42.659%; --ang: 67.1deg" data-ax="11.251" data-ay="42.659" data-nome="Rua Fernando Namora"><span class="txt" style="font-size: 10.5pt" contenteditable="true" spellcheck="false">R. Fernando<br>Namora</span><button class="rodar" title="Arrastar para rodar">&#8635;</button><button class="apagar" title="Remover etiqueta">&times;</button></div>
      
      <!-- As ruas que se veem no mapa e não estão na lista, para o "+ Rua" as
           propor: o mapa só nomeia algumas, para não se encher de nomes -->
      <ul class="ruas-perto" hidden><li>Rua Fernando Namora</li><li>Rua João Villaret</li></ul>
      <div class="ferramentas">
        <button onclick="novaEtiqueta('rua')">+ Rua no mapa</button>
        <button onclick="novaEtiqueta('porta')">+ Nº</button>
      </div>
    </div>
  </div>

  <!-- Verso -->
  <div class="card verso">
    <p class="titulo-verso">Território 4.10</p>

<script>
  window.addEventListener('message', function(event) {
    if (event.data === 'print') {
      window.print();
    } else if (event.data === 'download') {
      // Mesmo nome do ficheiro original: é para substituir o cartão na pasta
      // da zona, e assim as alterações passam a contar nas próximas
      // gerações e no mapa exportado. (O browser não pode escrever
      // diretamente no ficheiro, daí a passagem pela pasta de descargas.)
      const blob = new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML],
                            {type: 'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Cartao_4.10.html';
      a.click();
      URL.revokeObjectURL(url);
    }
  });

  // Ajusta o corpo de letra da lista ao espaço disponível: cresce quando há
  // poucas ruas e só encolhe o necessário quando há muitas. Nunca passa dos
  // 13,5 pt, para ficar sempre abaixo do rótulo "LOCALIZAÇÕES".
  function ajustarLista() {
    const caixa = document.querySelector('.locations');
    const lista = document.querySelector('.ruas');
    if (!caixa || !lista || !lista.lastElementChild) return;

    // Medir pela posição do último item: com colunas, o que não cabe passa
    // para uma coluna seguinte em vez de aumentar a altura, e nem
    // scrollHeight nem scrollWidth dão por isso.
    function cabe() {
      const ultimo = lista.lastElementChild.getBoundingClientRect();
      const dentro = caixa.getBoundingClientRect();
      return ultimo.bottom <= dentro.bottom - 1 && ultimo.right <= dentro.right - 1;
    }

    // Uma coluna à largura toda aproveita melhor o espaço do que duas
    // colunas estreitas, onde nomes como "Av. Comandante Gilberto Duarte e
    // Duarte" ocupam quatro linhas
    lista.style.columns = '';
    for (let pt = 13.5; pt >= 7.5; pt -= 0.5) {
      lista.style.fontSize = pt + 'pt';
      if (cabe()) return;
    }
    // Só em último caso: duas colunas, para nada ficar de fora
    lista.style.columns = '2';
    lista.style.columnGap = '3mm';
    for (let pt = 10; pt >= 6.5; pt -= 0.5) {
      lista.style.fontSize = pt + 'pt';
      if (cabe()) return;
    }
  }

  // --- Lista de ruas -------------------------------------------------------
  function acrescentarRua(texto, aEditar) {
    const lista = document.querySelector('.ruas');
    const numerada = !!lista.querySelector('.num');
    const li = document.createElement('li');
    li.innerHTML = (numerada
        ? '<span class="num">' + (lista.children.length + 1) + '</span>'
        : '<span class="traco">&ndash;</span>') +
      '<span class="nome" contenteditable="true" spellcheck="false"></span>' +
      '<button class="apagar-linha" title="Remover rua">&times;</button>';
    const nome = li.querySelector('.nome');
    nome.textContent = texto;
    lista.appendChild(li);
    ajustarLista();
    nome.focus();
    if (aEditar) document.getSelection().selectAllChildren(nome);
  }

  /* As ruas à volta já estão no cartão: são as etiquetas do mapa. Servem de
     lista de onde escolher, para não se escrever à mão (e mal) um nome que o
     mapa já sabe. Só aparecem as que ainda faltam na lista das localizações. */
  function chaveRua(nome) {
    return String(nome || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '');
  }

  // Os cartões antigos não trazem o nome por extenso na etiqueta, só o que
  // está desenhado no mapa ("R. das Flores"). Desfaz-se a abreviatura, senão
  // a mesma rua aparecia como sugestão por já estar na lista com outro nome.
  const TIPOS_DE_VIA = {
    'r.': 'Rua', 'av.': 'Avenida', 'tv.': 'Travessa', 'pct.': 'Praceta',
    'lg.': 'Largo', 'bc.': 'Beco', 'estr.': 'Estrada', 'pç.': 'Praça',
    'cç.': 'Calçada', 'cam.': 'Caminho', 'al.': 'Alameda', 'rot.': 'Rotunda',
    'esc.': 'Escadinhas', 'qta.': 'Quinta', 'jd.': 'Jardim', 'imp.': 'Impasse'
  };

  function nomeDaEtiqueta(etiqueta) {
    if (etiqueta.dataset.nome) return etiqueta.dataset.nome;
    const txt = etiqueta.querySelector('.txt');
    if (!txt) return '';
    const palavras = txt.innerText.replace(/\s+/g, ' ').trim().split(' ');
    const porExtenso = TIPOS_DE_VIA[(palavras[0] || '').toLowerCase()];
    if (porExtenso) palavras[0] = porExtenso;
    return palavras.join(' ');
  }

  function ruasSugeridas() {
    const jaLa = {};
    document.querySelectorAll('.ruas .nome').forEach(function(n) {
      jaLa[chaveRua(n.dataset.completo || '')] = true;
      jaLa[chaveRua(n.textContent)] = true;
    });
    const vistas = {};
    const faltam = [];
    function juntar(nome) {
      const chave = chaveRua(nome);
      if (!chave || jaLa[chave] || vistas[chave]) return;
      vistas[chave] = true;
      faltam.push(nome);
    }
    document.querySelectorAll('.etiqueta.rua, .etiqueta.vizinha').forEach(function(e) {
      juntar(nomeDaEtiqueta(e));
    });
    document.querySelectorAll('.ruas-perto li').forEach(function(li) {
      juntar(li.textContent.trim());
    });
    return faltam.sort(function(a, b) { return a.localeCompare(b, 'pt'); });
  }

  function fecharSugestoes() {
    const caixa = document.querySelector('.sugestoes');
    if (caixa) caixa.remove();
  }

  function novaRua(botao) {
    if (document.querySelector('.sugestoes')) { fecharSugestoes(); return; }
    const faltam = ruasSugeridas();
    if (!faltam.length) { acrescentarRua('Nova rua', true); return; }

    const caixa = document.createElement('div');
    caixa.className = 'sugestoes';
    faltam.forEach(function(nome) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = nome;
      b.onclick = function() { fecharSugestoes(); acrescentarRua(nome, false); };
      caixa.appendChild(b);
    });
    const mao = document.createElement('button');
    mao.type = 'button';
    mao.className = 'a-mao';
    mao.textContent = '✎ Escrever à mão';
    mao.onclick = function() { fecharSugestoes(); acrescentarRua('Nova rua', true); };
    caixa.appendChild(mao);

    /* Na coluna toda, e não dentro das localizações: essa tem o overflow
       escondido (é o que faz a lista encolher em vez de crescer) e recortava
       a caixa. As medidas são as do próprio cartão, por isso continuam certas
       mesmo quando a página o encolhe para caber no ecrã. */
    const barra = botao.closest('.sidebar');
    barra.appendChild(caixa);
    caixa.style.left = botao.offsetLeft + 'px';
    caixa.style.top = (botao.offsetTop + botao.offsetHeight + 2) + 'px';
    const limite = barra.clientHeight - 4;
    if (caixa.offsetTop + caixa.offsetHeight > limite) {
      caixa.style.top = Math.max(2, limite - caixa.offsetHeight) + 'px';
    }
  }

  document.addEventListener('click', function(ev) {
    if (!ev.target.closest('.sugestoes') && !ev.target.closest('.btn-linha')) {
      fecharSugestoes();
    }
  }, true);

  // Se a lista for numerada, os números têm de acompanhar as remoções
  function renumerar() {
    document.querySelectorAll('.ruas .num').forEach(function(n, i) {
      n.textContent = i + 1;
    });
  }

  document.addEventListener('click', function(ev) {
    const linha = ev.target.closest('.apagar-linha');
    if (linha) {
      linha.closest('li').remove();
      renumerar();
      ajustarLista();
      return;
    }
    const etiqueta = ev.target.closest('.etiqueta .apagar');
    if (etiqueta) {
      etiqueta.closest('.etiqueta').remove();
      desenharChamadas();
    }
  });

  // --- Etiquetas do mapa ---------------------------------------------------
  function novaEtiqueta(tipo) {
    const mapa = document.getElementById('mapa');
    const div = document.createElement('div');
    div.className = 'etiqueta ' + tipo;
    div.style.left = '50%';
    div.style.top = '50%';
    div.style.setProperty('--ang', '0deg');
    div.innerHTML = '<span class="txt" contenteditable="true" spellcheck="false">' +
      (tipo === 'porta' ? 'Nº 1' : 'Nome da rua') + '</span>' +
      '<button class="rodar" title="Arrastar para rodar">&#8635;</button>' +
      '<button class="apagar" title="Remover etiqueta">&times;</button>';
    mapa.appendChild(div);
    const txt = div.querySelector('.txt');
    txt.focus();
    document.getSelection().selectAllChildren(txt);
  }

  /* Arrastar para acertar a posição; a pega roda a etiqueta, e a roda do rato
     também. Eventos de PONTEIRO, e não de rato: são os mesmos para rato,
     caneta e dedo, e sem eles não havia maneira nenhuma de mexer uma etiqueta
     de sítio no telemóvel ou no tablet. */
  let arrasto = null;

  let rotacao = null;

  /* Sem rato não há hover, e o × e a pega de rodar (que só aparecem no hover)
     nunca se veriam. Num toque é a própria etiqueta tocada que os mostra. */
  function marcarTocada(etiqueta) {
    document.querySelectorAll('.etiqueta.tocada').forEach(function(e) {
      if (e !== etiqueta) e.classList.remove('tocada');
    });
    if (etiqueta) etiqueta.classList.add('tocada');
  }

  document.addEventListener('pointerdown', function(ev) {
    if (ev.button > 0) return;                  // botão do meio ou da direita
    const pega = ev.target.closest('.rodar');
    if (pega) {
      rotacao = pega.closest('.etiqueta');
      rotacao.classList.add('a-rodar');
      marcarTocada(rotacao);
      pega.setPointerCapture(ev.pointerId);
      ev.preventDefault();
      return;
    }
    const etiqueta = ev.target.closest('.etiqueta');
    if (!etiqueta) { marcarTocada(null); return; }
    marcarTocada(etiqueta);
    if (ev.target.closest('.apagar')) return;
    arrasto = {etiqueta: etiqueta, x0: ev.clientX, y0: ev.clientY,
               moveu: false, ponteiro: ev.pointerId,
               // Um dedo treme sempre um pouco ao pousar; o rato não.
               folga: ev.pointerType === 'mouse' ? 4 : 9};
    // Sem capturar o ponteiro, um dedo (ou um rato) que saia de cima da
    // etiqueta deixa de dar notícias e ela fica a meio do caminho.
    etiqueta.setPointerCapture(ev.pointerId);
    // De propósito sem preventDefault: um toque que não chegue a ser arrasto
    // tem de continuar a pôr o cursor dentro do texto, para se poder corrigir.
  });

  document.addEventListener('pointermove', function(ev) {
    if (rotacao) {
      // A pega está por cima da etiqueta: o ângulo é o do ponteiro visto do
      // centro, com os 90 graus dessa posição descontados
      const caixa = rotacao.getBoundingClientRect();
      const ang = Math.atan2(ev.clientY - (caixa.top + caixa.height / 2),
                             ev.clientX - (caixa.left + caixa.width / 2)) * 180 / Math.PI + 90;
      rotacao.style.setProperty('--ang', Math.round(ang * 10) / 10 + 'deg');
      ev.preventDefault();
      return;
    }
    if (!arrasto || ev.pointerId !== arrasto.ponteiro) return;
    if (!arrasto.moveu &&
        Math.abs(ev.clientX - arrasto.x0) + Math.abs(ev.clientY - arrasto.y0) < arrasto.folga) return;
    arrasto.moveu = true;
    const area = document.getElementById('mapa').getBoundingClientRect();
    arrasto.etiqueta.style.left =
      Math.max(0, Math.min(100, (ev.clientX - area.left) / area.width * 100)) + '%';
    arrasto.etiqueta.style.top =
      Math.max(0, Math.min(100, (ev.clientY - area.top) / area.height * 100)) + '%';
    desenharChamadas();
    ev.preventDefault();
  });

  function largarPonteiro() {
    if (rotacao) {
      rotacao.classList.remove('a-rodar');
      rotacao = null;
    }
    arrasto = null;
  }

  document.addEventListener('pointerup', largarPonteiro);
  // O browser pode tirar-nos o ponteiro a meio (um segundo dedo no ecrã, uma
  // chamada a entrar): sem isto ficava um arrasto preso para sempre.
  document.addEventListener('pointercancel', largarPonteiro);

  document.addEventListener('wheel', function(ev) {
    const etiqueta = ev.target.closest('.etiqueta');
    if (!etiqueta) return;
    const atual = parseFloat(etiqueta.style.getPropertyValue('--ang')) || 0;
    etiqueta.style.setProperty('--ang', (atual + (ev.deltaY > 0 ? 5 : -5)) + 'deg');
    ev.preventDefault();
  }, {passive: false});

  // Linha a ligar a etiqueta ao ponto exato, quando foi afastada dele
  function desenharChamadas() {
    const svg = document.getElementById('chamadas');
    if (!svg) return;
    let linhas = '';
    document.querySelectorAll('.etiqueta[data-ax]').forEach(function(e) {
      const ax = parseFloat(e.dataset.ax), ay = parseFloat(e.dataset.ay);
      const x = parseFloat(e.style.left), y = parseFloat(e.style.top);
      if (Math.hypot(x - ax, y - ay) < 2.5) return;
      linhas += '<line x1="' + ax + '" y1="' + ay + '" x2="' + x + '" y2="' + y +
        '" stroke="#000" stroke-width="3" vector-effect="non-scaling-stroke"/>' +
        '<line x1="' + ax + '" y1="' + ay + '" x2="' + x + '" y2="' + y +
        '" stroke="#fcca03" stroke-width="1.4" vector-effect="non-scaling-stroke"/>';
    });
    svg.innerHTML = linhas;
  }

  window.addEventListener('load', function() { ajustarLista(); desenharChamadas(); });
  window.addEventListener('beforeprint', ajustarLista);
  document.addEventListener('input', function(ev) {
    const nome = ev.target.closest('.ruas .nome');
    if (nome) nome.removeAttribute('data-completo');  // passou a ser o texto escrito
    ajustarLista();
  });
</script>
</body>
</html>
